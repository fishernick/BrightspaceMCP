[project]
name = "brightspacemcp"
version = "0.1.0"
description = "MCP server exposing the Purdue Brightspace (D2L Valence) LMS API as tools"
readme = "README.md"
authors = [
    { name = "fisher", email = "fishe599@purdue.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.1.1",
    "httpx2>=2.12",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
# Backs the getLink lecture-video transcription tool. Heavy (pulls PyTorch);
# opt in with `uv sync --extra transcription` and `playwright install chromium`.
transcription = [
    "playwright>=1.49",
    "openai-whisper>=20250625",
]

[project.scripts]
brightspacemcp = "brightspacemcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
